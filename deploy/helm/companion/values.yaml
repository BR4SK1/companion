# Default values for the companion application chart.
#
# Defaults are deliberately generic and publishable: registry paths, image
# tags, ingress hostnames, middleware names, and model ids are
# environment-specific configuration supplied through a per-environment values
# file, which this repository keeps outside version control (see
# ../environments/README.md). Secret values are never accepted here; the
# deployables read them from existing Kubernetes Secrets referenced by name.

# Deployment-purpose attestation, fail closed: every install must declare
# exactly what it is and where it runs; unknown or missing values fail
# rendering.
deployment:
  # Exactly "non-production" or "production". Deployment-specific
  # capabilities key off it: the web test-entry gate renders only for
  # "non-production", and the application refuses to open the gate for a
  # "production" deployment at runtime.
  purpose: ""
  # The exact namespace this release is installed into. The chart fails
  # rendering when it differs from the release namespace. The value is
  # carried into the container, where the application re-verifies it against
  # the Kubernetes-provided pod namespace (downward API) before the
  # test-entry gate may open.
  namespace: ""

web:
  enabled: true
  image:
    # Registry path up to but excluding the tag, e.g. <registry-host>/<project>/web.
    repository: ""
    # Immutable candidate tag (for example the deployed commit's short SHA).
    tag: ""
  replicas: 1
  containerPort: 3000
  service:
    port: 3000
  ingress:
    enabled: true
    # Fully qualified hostname for this environment.
    host: ""
    # Optional Traefik middlewares, referenced the way the target cluster
    # expects (for example "<name>@kubernetescrd").
    middlewares: []
  # Optional K3s ServiceLB (LoadBalancer) Service for the web client: it
  # publishes the Service port directly on the node host, bypassing the
  # Traefik ingress and every middleware configured on it. See the chart
  # README for the health and security implications of that direct path.
  loadBalancer:
    # Disabled by default, and production-gated: the chart refuses to render
    # it unless deployment.purpose is exactly "production", so a
    # non-production release can never expose the web client on a host port
    # (its only public route is the Traefik Ingress). Because the
    # non-production-only test gate requires a non-production purpose, the
    # gate and this Service can never render in the same release.
    enabled: false
    # Node host port that K3s ServiceLB binds for the web client (the
    # Service's published port; traffic reaches the web container's HTTP
    # port). Required when enabled — there is deliberately no default — and
    # it must be an integer between 1 and 65535 that differs from
    # web.service.port. Choose it under the hosting environment's host-port
    # policy and keep it unique across that environment's published
    # services; the chart cannot detect a host-port collision between
    # different releases.
    hostPort: ""
  # Name of an existing Secret in the release namespace that must provide the
  # keys WEB_OIDC_CLIENT_SECRET, WEB_SESSION_SECRET, and WEB_WORKER_TOKEN.
  # The chart never creates or templates secrets. The BFF fails closed at
  # runtime when its configuration is incomplete; see apps/web/README.md.
  existingSecret: ""
  # Non-secret BFF environment configuration. These are required for the BFF
  # to serve the conversation: WEB_PUBLIC_URL, WEB_OIDC_ISSUER_URL,
  # WEB_OIDC_CLIENT_ID, WEB_OWNER_SUBJECTS (comma-separated identity-provider
  # subjects of the owner). WEB_WORKER_URL is derived from the worker service
  # when the worker is enabled; supply it here only when the worker is
  # disabled. Empty values are skipped so a missing required variable fails
  # closed in the web app's own validation instead of opening access.
  # WEB_TEST_GATE_* variables are rejected here; the gate is configured
  # only through the testGate block below.
  env: {}
  # Non-production-only test-entry gate for end-to-end testing (NEVER
  # production). When enabled, the web container opens one additional HTTP
  # listener bound strictly to 127.0.0.1 inside the pod's network
  # namespace: unauthenticated full-application access (reading and sending
  # real conversation, which can incur provider/model costs), reachable
  # only through `kubectl port-forward` — a loopback-bound socket is not
  # addressable through the ClusterIP Service or the Ingress. The gate is
  # fail-closed (default off; checked at listener bind, on every request,
  # at session issuance, and on every session use) and signs its own
  # identity-free test sessions with a dedicated secret. See
  # apps/web/README.md for the security model and the safe access
  # procedure.
  testGate:
    # Production deployments must leave this disabled: the chart refuses to
    # render the gate for a deployment.purpose of "production". Even when
    # enabled, the listener is loopback-only and no Service, Ingress, or
    # other route to it is ever created by this chart.
    enabled: false
    # Loopback listener port inside the pod; must differ from
    # web.containerPort and web.service.port. Access with
    # `kubectl port-forward -n <namespace> pod/<web-pod> 3100:3100` and use
    # http://127.0.0.1:3100 locally.
    port: 3100
    # Name of an existing Secret in the release namespace that must provide
    # the key WEB_TEST_GATE_SESSION_SECRET (at least 32 characters). It must
    # be a DIFFERENT Secret from web.existingSecret — the test gate must
    # never sign sessions with the owner session secret; rendering fails
    # otherwise.
    existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 1
  # Private HTTP API listener (the web BFF's service-to-service boundary).
  # Exposed only through a cluster-internal Service; there is no ingress and
  # no public route to it.
  containerPort: 8080
  service:
    port: 8080
  # Name of an existing Secret in the release namespace that must provide the
  # keys WORKER_DATABASE_URL, OPENROUTER_API_KEY, and WORKER_API_TOKEN. The
  # chart never creates or templates secrets. WORKER_API_TOKEN is the private
  # service-to-service credential; the web deployment's WEB_WORKER_TOKEN must
  # hold the same value.
  existingSecret: ""
  # Non-secret worker environment configuration (for example model ids).
  # Empty values are skipped so a missing required variable fails in the
  # worker's own startup validation with a named-variable error.
  env: {}
  # The worker finishes its in-flight turn (including publication) before
  # exiting on SIGTERM; allow a full cycle with the default chat timeout.
  terminationGracePeriodSeconds: 180
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
