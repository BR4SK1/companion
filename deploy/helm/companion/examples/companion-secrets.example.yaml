# Example secret manifest for the companion deployables.
#
# This file is an example with placeholder values only. Copy it to a local
# location excluded from version control (for example `.secrets/`), fill in
# real values, apply it to the target namespace before installing the chart,
# and never commit the real file. The chart references this Secret by name
# (`worker.existingSecret` and `web.existingSecret`) and never creates or
# templates secrets itself.
#
# WORKER_DATABASE_URL must point at a dedicated non-production database that
# is separate from any production database. The worker applies its own
# domain-owned schema migrations at startup.
#
# WORKER_API_TOKEN and WEB_WORKER_TOKEN must hold the SAME value: it is the
# private service-to-service credential the web BFF presents to the worker's
# cluster-internal HTTP API. Generate it with a secrets generator (for
# example `openssl rand -base64 32`).
#
# WEB_SESSION_SECRET signs the BFF's session and login-flow cookies; use at
# least 32 characters from a secrets generator.
#
# WEB_PUBLIC_URL is the public origin of the web app (for example
# https://companion.example.com). It is non-secret but travels with the
# other deployment values here for convenience; it is also accepted through
# the chart's `web.env` values instead.
apiVersion: v1
kind: Secret
metadata:
  name: companion-secrets
  namespace: companion-np
type: Opaque
stringData:
  WORKER_DATABASE_URL: postgresql://USER:PASSWORD@HOST:PORT/DATABASE
  OPENROUTER_API_KEY: replace-with-openrouter-api-key
  WORKER_API_TOKEN: replace-with-generated-worker-api-token
  WEB_OIDC_CLIENT_SECRET: replace-with-keycloak-confidential-client-secret
  WEB_SESSION_SECRET: replace-with-generated-session-secret-of-at-least-32-characters
  WEB_WORKER_TOKEN: must-equal-WORKER_API_TOKEN
  WEB_PUBLIC_URL: https://companion.example.com
