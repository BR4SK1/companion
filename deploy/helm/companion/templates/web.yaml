{{- include "companion.validateDeployment" . }}
{{- if .Values.web.enabled }}
{{- $repository := required "web.image.repository is required when web is enabled" .Values.web.image.repository -}}
{{- $tag := required "web.image.tag is required when web is enabled" .Values.web.image.tag -}}
{{- $secret := required "web.existingSecret is required when web is enabled (must provide WEB_OIDC_CLIENT_SECRET, WEB_SESSION_SECRET, and WEB_WORKER_TOKEN keys)" .Values.web.existingSecret -}}
{{- $workerUrl := "" -}}
{{- if .Values.worker.enabled -}}
{{- $workerUrl = printf "http://%s:%v" (include "companion.workerName" .) .Values.worker.service.port -}}
{{- else -}}
{{- $workerUrl = required "web.env.WEB_WORKER_URL is required when web is enabled without the worker" (index .Values.web.env "WEB_WORKER_URL" | default "") -}}
{{- end -}}
{{- /* The BFF fails closed when its configuration is incomplete, so a
missing non-secret value would deploy an app that only ever reports
"unavailable"; require the values at render time instead. */}}
{{- $requirePublicUrl := required "web.env.WEB_PUBLIC_URL is required when web is enabled" (index .Values.web.env "WEB_PUBLIC_URL" | default "") -}}
{{- $requireIssuerUrl := required "web.env.WEB_OIDC_ISSUER_URL is required when web is enabled" (index .Values.web.env "WEB_OIDC_ISSUER_URL" | default "") -}}
{{- $requireClientId := required "web.env.WEB_OIDC_CLIENT_ID is required when web is enabled" (index .Values.web.env "WEB_OIDC_CLIENT_ID" | default "") -}}
{{- $requireOwnerSubjects := required "web.env.WEB_OWNER_SUBJECTS is required when web is enabled" (index .Values.web.env "WEB_OWNER_SUBJECTS" | default "") -}}
{{- /* Non-production-only test-entry gate guards. The gate grants
unauthenticated full-application access on a loopback-only listener; it is
fail-closed in the application, and rendering fails loudly rather than
producing a deployment that could weaken the owner-only boundary. It may
only render for a declared non-production deployment in the one authorized
non-production namespace (pinned below, matching
AUTHORIZED_NON_PRODUCTION_NAMESPACE in apps/web/server/gate-env.mjs — keep
the two in sync): purpose and downward-API agreement alone would let any
namespace self-declare itself non-production. */}}
{{- $purpose := .Values.deployment.purpose -}}
{{- $declaredNamespace := .Values.deployment.namespace -}}
{{- $authorizedGateNamespace := "companion-np" -}}
{{- $testGateEnabled := false -}}
{{- $testGatePort := 0 -}}
{{- $testGateSecret := "" -}}
{{- if .Values.web.testGate.enabled }}
{{- if ne $purpose "non-production" }}{{ fail (printf "web.testGate.enabled must never be set for a production deployment (deployment.purpose is %s): the test entry is non-production-only" $purpose) }}{{ end }}
{{- if ne $declaredNamespace $authorizedGateNamespace }}{{ fail (printf "web.testGate.enabled requires deployment.namespace to be the authorized non-production namespace (%s), got %s: no other namespace may self-declare itself non-production" $authorizedGateNamespace $declaredNamespace) }}{{ end }}
{{- $testGateEnabled = true -}}
{{- $testGatePort = int .Values.web.testGate.port -}}
{{- if or (lt $testGatePort 1) (gt $testGatePort 65535) }}{{ fail (printf "web.testGate.port must be an integer between 1 and 65535 when web.testGate is enabled, got %s" (toString .Values.web.testGate.port)) }}{{ end }}
{{- if eq $testGatePort (int .Values.web.containerPort) }}{{ fail "web.testGate.port must differ from web.containerPort" }}{{ end }}
{{- if eq $testGatePort (int .Values.web.service.port) }}{{ fail "web.testGate.port must differ from web.service.port" }}{{ end }}
{{- $testGateSecret = required "web.testGate.existingSecret is required when web.testGate is enabled (must provide the WEB_TEST_GATE_SESSION_SECRET key)" .Values.web.testGate.existingSecret -}}
{{- if eq $testGateSecret $secret }}{{ fail "web.testGate.existingSecret must be a separate Secret from web.existingSecret: the test gate must never sign sessions with the owner session secret" }}{{ end }}
{{- end }}
{{- range $key, $value := .Values.web.env }}
{{- if or (hasPrefix "WEB_TEST_GATE_" $key) (hasPrefix "COMPANION_" $key) }}{{ fail (printf "web.env must not set %s: deployment-purpose attestation and test-gate configuration are chart-owned" $key) }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "companion.webName" . }}
  labels:
    {{- include "companion.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        {{- include "companion.labels" . | nindent 8 }}
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ $repository }}:{{ $tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
{{- if $testGateEnabled }}
            # The test-entry listener is loopback-only inside the container;
            # declaring the port is informational. This chart deliberately
            # creates NO Service or Ingress for it: the only access path is
            # `kubectl port-forward` (the kubelet dials 127.0.0.1 inside the
            # pod's network namespace).
            - name: test-entry
              containerPort: {{ $testGatePort }}
{{- end }}
          env:
            - name: PORT
              value: {{ .Values.web.containerPort | quote }}
            - name: WEB_PUBLIC_URL
              value: {{ index .Values.web.env "WEB_PUBLIC_URL" | quote }}
            - name: WEB_OIDC_ISSUER_URL
              value: {{ index .Values.web.env "WEB_OIDC_ISSUER_URL" | quote }}
            - name: WEB_OIDC_CLIENT_ID
              value: {{ index .Values.web.env "WEB_OIDC_CLIENT_ID" | quote }}
            - name: WEB_OWNER_SUBJECTS
              value: {{ index .Values.web.env "WEB_OWNER_SUBJECTS" | quote }}
            - name: WEB_WORKER_URL
              value: {{ $workerUrl | quote }}
            - name: WEB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: WEB_OIDC_CLIENT_SECRET
            - name: WEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: WEB_SESSION_SECRET
            - name: WEB_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: WEB_WORKER_TOKEN
{{- /* Deployment-purpose attestation carried into the container: the
declared purpose and namespace are chart-rendered, and the pod's actual
namespace arrives through the Kubernetes downward API (kubelet-provided,
never a value and never request data). The application re-verifies both
at runtime, fail-closed, before the test-entry gate may open. */}}
            - name: COMPANION_DEPLOYMENT_PURPOSE
              value: {{ $purpose | quote }}
            - name: COMPANION_DEPLOYMENT_NAMESPACE
              value: {{ $declaredNamespace | quote }}
            - name: COMPANION_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- if $testGateEnabled }}
{{- /* Non-production-only test-entry gate. The gate is fail-closed in the
application (listener bound to 127.0.0.1, per-request socket and gate
checks, separate session secret). NEVER enable this in production. */}}
            - name: WEB_TEST_GATE_ENABLED
              value: "true"
            - name: WEB_TEST_GATE_PORT
              value: {{ $testGatePort | quote }}
            - name: WEB_TEST_GATE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $testGateSecret }}
                  key: WEB_TEST_GATE_SESSION_SECRET
{{- end }}
            {{- range $key, $value := .Values.web.env }}
            {{- if and $value (ne $key "WEB_WORKER_URL") (ne $key "WEB_PUBLIC_URL") (ne $key "WEB_OIDC_ISSUER_URL") (ne $key "WEB_OIDC_CLIENT_ID") (ne $key "WEB_OWNER_SUBJECTS") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            {{- /* Probes deliberately target the main `http` port only: the
            test-entry listener (if enabled) accepts loopback connections
            only, so a kubelet probe against it could never succeed — and
            must never be configured, because that would require widening
            the listener. */}}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "companion.webName" . }}
  labels:
    {{- include "companion.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- end }}
