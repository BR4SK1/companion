{{- if .Values.web.enabled }}
{{- if .Values.web.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "companion.webName" . }}
  labels:
    {{- include "companion.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- with .Values.web.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . }}
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ required "web.ingress.host is required when web ingress is enabled" .Values.web.ingress.host }}
  rules:
    - host: {{ required "web.ingress.host is required when web ingress is enabled" .Values.web.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "companion.webName" . }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
{{- end }}
